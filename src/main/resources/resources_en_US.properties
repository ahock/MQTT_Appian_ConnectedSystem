# Default internationalization bundle for the MQTT Broker Connected System plug-in.
#
# Appian derives each template's displayed name and description from keys that follow the pattern
# [TemplateClass].name / [TemplateClass].description, where TemplateClass is the simple (case
# sensitive) class name of the registered template. Every registered template below has both keys.
#
# Field labels are additionally provided here using the convention
# [TemplateClass].[fieldKey].label so the field-label strings live in the i18n bundle alongside the
# template names. The field keys match de.hock.mqtt.validation.ConfigFields (connected system)
# and the integration input keys declared on each integration class.

# --- Connected System template ---------------------------------------------------------------
MqttConnectedSystemTemplate.name=MQTT Broker
MqttConnectedSystemTemplate.description=Reusable MQTT broker connection configuration (connection, authentication, TLS, reconnection, last will, and session settings) shared by the MQTT publish and subscribe integrations.

# Connection group
MqttConnectedSystemTemplate.brokerHost.label=Broker Host
MqttConnectedSystemTemplate.brokerPort.label=Broker Port
MqttConnectedSystemTemplate.clientIdentifier.label=Client Identifier
MqttConnectedSystemTemplate.connectionTimeoutSeconds.label=Connection Timeout (seconds)

# Authentication group
MqttConnectedSystemTemplate.username.label=Username
MqttConnectedSystemTemplate.password.label=Password

# TLS group
MqttConnectedSystemTemplate.tlsEnabled.label=Enable TLS
MqttConnectedSystemTemplate.caCertificate.label=CA Certificate (PEM)
MqttConnectedSystemTemplate.clientCertificate.label=Client Certificate (PEM)
MqttConnectedSystemTemplate.clientPrivateKey.label=Client Private Key
MqttConnectedSystemTemplate.keyPassphrase.label=Key Passphrase

# Reconnection group
MqttConnectedSystemTemplate.autoReconnectEnabled.label=Enable Automatic Reconnect
MqttConnectedSystemTemplate.maxReconnectAttempts.label=Max Reconnect Attempts
MqttConnectedSystemTemplate.reconnectIntervalSeconds.label=Reconnect Interval (seconds)

# Last Will and Testament group
MqttConnectedSystemTemplate.lwtTopic.label=LWT Topic
MqttConnectedSystemTemplate.lwtPayload.label=LWT Payload
MqttConnectedSystemTemplate.lwtQos.label=LWT QoS
MqttConnectedSystemTemplate.lwtRetained.label=LWT Retained

# Session group
MqttConnectedSystemTemplate.cleanSession.label=Clean Session
MqttConnectedSystemTemplate.keepAliveSeconds.label=Keep Alive (seconds)

# --- Publish integration ----------------------------------------------------------------------
MqttPublishIntegration.name=Publish MQTT Message
MqttPublishIntegration.description=Publishes a single message to an MQTT topic at the requested quality of service, optionally retained.

MqttPublishIntegration.topic.label=Topic
MqttPublishIntegration.payload.label=Payload
MqttPublishIntegration.qos.label=QoS
MqttPublishIntegration.retained.label=Retained

# --- Subscribe integration --------------------------------------------------------------------
MqttSubscribeIntegration.name=Subscribe to MQTT Topics
MqttSubscribeIntegration.description=Collects messages from one or more subscribed MQTT topics, returning the messages gathered within the configured count and wait limits.

MqttSubscribeIntegration.topicFilters.label=Topic Filters
MqttSubscribeIntegration.qos.label=Quality of Service
MqttSubscribeIntegration.maxWaitSeconds.label=Max Wait (seconds)
MqttSubscribeIntegration.maxMessageCount.label=Max Message Count
