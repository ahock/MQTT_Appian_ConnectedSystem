# Default internationalization bundle for the MQTT Broker Connected System plug-in.
#
# Appian derives each template's displayed name and description from
# [TemplateClass].name / [TemplateClass].description, where TemplateClass is the simple
# (case-sensitive) class name of the registered template. Field labels follow
# [TemplateClass].[fieldKey].label. The connected system field keys are the eleven constants on
# de.hock.mqtt.template.MqttConnectedSystemTemplate; the publish input keys are the three constants
# on de.hock.mqtt.integration.MqttPublishIntegration; the subscribe input keys are the four
# constants on de.hock.mqtt.integration.MqttSubscribeIntegration. Three template classes, 24 keys,
# 18 of them field labels. There are no orphan keys and no missing keys.

# --- Connected System template ---------------------------------------------------------------
MqttConnectedSystemTemplate.name=MQTT Broker
MqttConnectedSystemTemplate.description=Reusable MQTT broker connection configuration (host, port, optional server-side TLS with a pasted CA certificate, client identifier, optional credentials, and session settings) shared by the MQTT publish and subscribe integrations.

MqttConnectedSystemTemplate.brokerHost.label=Broker Host
MqttConnectedSystemTemplate.brokerPort.label=Broker Port
MqttConnectedSystemTemplate.tlsEnabled.label=Enable TLS
MqttConnectedSystemTemplate.caCertificate.label=CA Certificate
MqttConnectedSystemTemplate.clientIdentifier.label=Client Identifier
MqttConnectedSystemTemplate.username.label=Username
MqttConnectedSystemTemplate.password.label=Password
MqttConnectedSystemTemplate.connectionTimeoutSeconds.label=Connection Timeout
MqttConnectedSystemTemplate.keepAliveSeconds.label=Keep Alive Interval
MqttConnectedSystemTemplate.cleanSession.label=Clean Session
MqttConnectedSystemTemplate.autoReconnectEnabled.label=Automatic Reconnect

# --- Publish integration ----------------------------------------------------------------------
MqttPublishIntegration.name=Publish MQTT Message
MqttPublishIntegration.description=Publishes a single message to an MQTT topic at the requested quality of service.

MqttPublishIntegration.topic.label=Topic
MqttPublishIntegration.payload.label=Payload
MqttPublishIntegration.qos.label=QoS

# --- Subscribe integration --------------------------------------------------------------------
MqttSubscribeIntegration.name=Subscribe to MQTT Topics
MqttSubscribeIntegration.description=Collects messages from one MQTT topic filter, returning as soon as the message count is reached or the wait elapses. An empty result is a success.

MqttSubscribeIntegration.topicFilter.label=Topic Filter
MqttSubscribeIntegration.qos.label=QoS
MqttSubscribeIntegration.maxWaitSeconds.label=Max Wait (seconds)
MqttSubscribeIntegration.maxMessageCount.label=Max Message Count
